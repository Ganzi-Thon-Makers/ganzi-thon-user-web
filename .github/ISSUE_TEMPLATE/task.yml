name: 작업 이슈
description: 기능 추가, 개선, 버그 수정 작업을 정리해요.
body:
  - type: dropdown
    id: type
    attributes:
      label: 작업 타입
      description: 고르면 `<타입>/<이슈 번호>` 브랜치가 자동으로 만들어져요.
      options:
        - feat - 새 기능
        - fix - 버그 수정
        - hotfix - 긴급 수정
        - refactor - 구조·성능 개선
        - style - 스타일·포맷
        - test - 테스트
        - docs - 문서
        - chore - 설정·빌드·CI
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 어떤 작업인가요
      description: 해결할 문제나 추가할 기능을 한두 문장으로 적어주세요. 버그라면 재현 방법과 기대한 동작을 함께 적어주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      description: 이 이슈에서 할 일을 1~2개로 적어주세요.
      value: |
        - [ ]

  - type: textarea
    id: references
    attributes:
      label: 참고
      description: 관련 이슈나 디자인 링크, 스크린샷이 있으면 첨부해 주세요.
