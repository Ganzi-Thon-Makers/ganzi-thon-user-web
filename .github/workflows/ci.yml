name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 로컬 훅을 건너뛴 커밋도 PR에서 다시 검사한다.
      - name: Commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEFTHOOK: 0 # CI에서는 git 훅 설치 생략
      # 빌드에 필요한 공개 환경변수. 실제 값은 저장소 Settings > Variables에 등록한다.
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://jsonplaceholder.typicode.com' }}
    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 package.json의 packageManager를 따른다.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check (typecheck · lint · format)
        run: pnpm check

      - name: Test
        run: pnpm test:run

      - name: Build
        run: pnpm build
