# 이슈 폼(task.yml)으로 이슈를 만들면 develop에서 <타입>/<이슈 번호> 브랜치를 만들고 라벨·담당자를 붙인다.
name: Issue Branch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body ?? "";
            const baseBranch = "develop";
            // 라벨은 GitHub 저장소 Labels에 미리 만들어 둔 이름과 정확히 같아야 한다.
            const LABELS = { feat: "✨ Feature", fix: "🐛 BugFix", hotfix: "🚨 Hotfix", refactor: "♻️ Refactor", style: "🎨 Style", test: "✅ Test", docs: "📝 Docs", chore: "🔧 Chore" };

            // 폼 본문의 "### 작업 타입" 섹션에서 타입을 읽는다. 폼으로 만들지 않은 이슈는 건너뛴다.
            const section = body.match(/###\s+작업 타입\s*\n+([\s\S]*?)(?=\n###\s|$)/)?.[1] ?? "";
            const type = section.trim().split(/\s/)[0];
            if (!LABELS[type]) {
              core.info("작업 타입이 없는 이슈라 브랜치를 만들지 않는다.");
              return;
            }

            const branch = `${type}/${issue.number}`;
            let created = true;
            try {
              const { data: base } = await github.rest.git.getRef({ ...context.repo, ref: `heads/${baseBranch}` });
              await github.rest.git.createRef({ ...context.repo, ref: `refs/heads/${branch}`, sha: base.object.sha });
            } catch (error) {
              if (error.status !== 422) throw error;
              created = false; // 이미 있는 브랜치
            }

            await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: [LABELS[type]] });
            try {
              await github.rest.issues.addAssignees({ ...context.repo, issue_number: issue.number, assignees: [issue.user.login] });
            } catch (error) {
              core.warning(`담당자 지정 실패: ${error.message}`);
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: [
                created ? "작업 브랜치를 만들었습니다." : "작업 브랜치가 이미 있습니다.",
                "",
                `- 브랜치: \`${branch}\` (base: \`${baseBranch}\`)`,
                "",
                "```bash",
                "git fetch origin",
                `git switch ${branch}`,
                "```",
              ].join("\n"),
            });
