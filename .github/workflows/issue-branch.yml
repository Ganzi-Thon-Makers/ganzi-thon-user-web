# 이슈 폼(task.yml)으로 이슈를 만들면 develop에서 <타입>/<이슈 번호>[-<이름>] 브랜치를 만들고 라벨·담당자를 붙인다.
name: Issue Branch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body ?? "";
            const baseBranch = "develop";
            // 라벨은 GitHub 저장소 Labels에 미리 만들어 둔 이름과 정확히 같아야 한다.
            const LABELS = { feat: "✨ Feature", fix: "🐛 BugFix", hotfix: "🚨 Hotfix", refactor: "♻️ Refactor", style: "🎨 Style", test: "✅ Test", docs: "📝 Docs", chore: "🔧 Chore" };

            // 폼 본문의 "### 작업 타입" 섹션에서 타입을 읽는다. 폼으로 만들지 않은 이슈는 건너뛴다.
            const section = body.match(/###\s+작업 타입\s*\n+([\s\S]*?)(?=\n###\s|$)/)?.[1] ?? "";
            const type = section.trim().split(/\s/)[0];
            // constructor·toString 같은 상속 속성을 타입으로 받지 않도록 own property만 허용한다.
            if (!Object.hasOwn(LABELS, type)) {
              core.info("작업 타입이 없는 이슈라 브랜치를 만들지 않는다.");
              return;
            }

            // 선택 입력. 비었거나(_No response_) 형식이 틀리면 번호만 쓴다.
            const nameInput = (body.match(/###\s+브랜치 이름 \(선택\)\s*\n+([\s\S]*?)(?=\n###\s|$)/)?.[1] ?? "").trim();
            const hasName = nameInput !== "" && nameInput !== "_No response_";
            const isValidName = /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(nameInput);
            const branch = hasName && isValidName ? `${type}/${issue.number}-${nameInput}` : `${type}/${issue.number}`;
            let created = true;
            try {
              const { data: base } = await github.rest.git.getRef({ ...context.repo, ref: `heads/${baseBranch}` });
              await github.rest.git.createRef({ ...context.repo, ref: `refs/heads/${branch}`, sha: base.object.sha });
            } catch (error) {
              // 422는 검증 실패에도 쓰이므로, 브랜치가 실제로 있을 때만 "이미 있음"으로 본다.
              if (error.status !== 422) throw error;
              try {
                await github.rest.git.getRef({ ...context.repo, ref: `heads/${branch}` });
              } catch {
                throw error;
              }
              created = false;
            }

            await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: [LABELS[type]] });
            try {
              await github.rest.issues.addAssignees({ ...context.repo, issue_number: issue.number, assignees: [issue.user.login] });
            } catch (error) {
              core.warning(`담당자 지정 실패: ${error.message}`);
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: [
                created ? "작업 브랜치를 만들었습니다." : "작업 브랜치가 이미 있습니다.",
                ...(hasName && !isValidName ? ["", `브랜치 이름 \`${nameInput}\`은 영문 소문자·숫자·하이픈만 쓸 수 있어 번호만 사용했습니다.`] : []),
                "",
                `- 브랜치: \`${branch}\` (base: \`${baseBranch}\`)`,
                "",
                "```bash",
                "git fetch origin",
                `git switch ${branch}`,
                "```",
              ].join("\n"),
            });
